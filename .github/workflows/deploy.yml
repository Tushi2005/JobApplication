name: Auto Deploy to Portainer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (no cache)
        run: |
          docker build --no-cache -t adamtuska/jobtracker-backend:latest .
          docker push adamtuska/jobtracker-backend:latest

      - name: Deploy on self-hosted runner
        run: |
          cd /mnt/Kulso_HDD/github/actions-runner/_work/JobApplication/JobApplication
          docker compose --env-file stack.env pull backend
          docker compose --env-file stack.env up -d backend