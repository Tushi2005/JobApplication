name: Backend CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Add dotnet to PATH
        run: echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/JobApplication

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/JobApplication

      - name: Run tests
        run: dotnet test --no-build --configuration Release
        working-directory: backend/JobApplication

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: backend/JobApplication
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jobtracker-backend:latest

      - name: Deploy to Portainer
        if: github.ref == 'refs/heads/master'
        run: |
          curl -X POST "${{ secrets.PORTAINER_URL }}/api/stacks/3/update?endpointId=1" \
            -H "Authorization: Bearer ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "env": [],
              "prune": true
            }'
