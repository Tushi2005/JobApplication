name: Backend CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- .NET SDK cache ----------
      - name: Cache .NET SDK
        uses: actions/cache@v4
        id: dotnet-cache
        with:
          path: .dotnet
          key: ${{ runner.os }}-dotnet-10.0

      - name: Install .NET SDK locally
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: |
          DOTNET_DIR="${{ github.workspace }}/.dotnet"
          mkdir -p "$DOTNET_DIR"
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_DIR"
          echo "$DOTNET_DIR" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$DOTNET_DIR" >> $GITHUB_ENV

      - name: Set .NET environment (cache hit)
        if: steps.dotnet-cache.outputs.cache-hit == 'true'
        run: |
          DOTNET_DIR="${{ github.workspace }}/.dotnet"
          echo "$DOTNET_DIR" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$DOTNET_DIR" >> $GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jobtracker-backend:latest

      - name: Deploy to Portainer
        if: github.ref == 'refs/heads/master'
        run: |
          curl -k -X PUT "https://192.168.1.108:31015/api/stacks/5/update?endpointId=3" \
            -H "Authorization: Bearer ${{ secrets.PORTAINER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "env": [],
              "prune": true,
              "pullImage": true,
              "forceUpdate": true
            }'
